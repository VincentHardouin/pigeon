name: Build and release

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: |
          sudo apt-get install -y --no-install-recommends luajit
          for f in pigeon.koplugin/*.lua; do luajit -bl "$f" > /dev/null; done
          sh -n pigeon.koplugin/pigeon.sh
      - name: Package
        run: zip -r pigeon.koplugin.zip pigeon.koplugin -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: pigeon.koplugin.zip

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Unsigned: a free Apple account can't sign in CI. AltStore or Sideloadly re-sign it on install.
      - name: Build unsigned IPA
        run: |
          xcodebuild -project ios/Pigeon.xcodeproj -scheme Pigeon -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Pigeon.app Payload/
          zip -r Pigeon-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: Pigeon-unsigned.ipa

  # Tags pushed with GITHUB_TOKEN don't trigger workflows, so assets are attached here.
  release:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, plugin, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            pigeon.koplugin.zip Pigeon-unsigned.ipa --repo "$GITHUB_REPOSITORY"
